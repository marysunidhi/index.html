<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection System - Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="background-effects">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>
    
    <div class="auth-container">
        <div class="auth-card glass-panel" id="authCard">
            <div class="auth-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>Fake News Detection Core</h2>
                <p>Sign in to access the system</p>
            </div>
            
            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>
                <button type="button" class="btn-primary auth-submit" onclick="login()">
                    Sign In
                    <div class="btn-glow"></div>
                </button>
                <p class="auth-switch">Don't have an account? <a href="#" onclick="toggleAuth()">Register now</a></p>
            </form>

            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="button" class="btn-primary auth-submit" onclick="register()">
                    Create Account
                    <div class="btn-glow"></div>
                </button>
                <p class="auth-switch">Already have an account? <a href="#" onclick="toggleAuth()">Sign in</a></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
